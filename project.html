    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0d1017;
            --bg2: #111620;
            --surface: rgba(22, 26, 35, 0.85);
            --surface2: rgba(27, 32, 43, 0.9);
            --line: #252b36;
            --text: #e9ebf1;
            --muted: #9aa1ae;
            --muted2: #6f7580;
            --accent: #3a86ff;
            --accent2: #22d39a;
            --max: 960px;
            --r: 16px;
            --ease: cubic-bezier(.22, 1, .36, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        .skip-link {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 10000;
            padding: 10px 14px;
            border-radius: 8px;
            background: #fff;
            color: #07101f;
            font-weight: 700;
            transform: translateY(-160%);
            transition: transform .2s ease;
        }

        .skip-link:focus { transform: translateY(0); }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(800px 600px at 70% 10%, rgba(58, 134, 255, 0.06) 0%, transparent 60%),
                radial-gradient(600px 400px at 20% 80%, rgba(34, 211, 154, 0.04) 0%, transparent 60%);
        }

        main.wrap {
            position: relative;
            z-index: 2;
        }

        /* TOPBAR */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 13, 19, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 14px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topbar-brand {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.01em;
            text-decoration: none;
            transition: color 0.3s;
        }

        .topbar-brand:hover {
            color: var(--accent);
        }

        .topbar-brand span {
            color: var(--muted);
            font-weight: 500;
        }

        .topbar-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 650;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.22s var(--ease);
            text-decoration: none;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--muted);
        }

        .topbar-btn:hover {
            border-color: rgba(255, 255, 255, 0.2);
            color: var(--text);
            background: rgba(255, 255, 255, 0.03);
        }

        .topbar-btn.primary {
            background: var(--accent);
            border: 1px solid var(--accent);
            color: #fff;
            box-shadow: 0 8px 24px rgba(58, 134, 255, 0.2);
        }

        .topbar-btn.primary:hover {
            background: #256ee0;
            box-shadow: 0 12px 32px rgba(58, 134, 255, 0.3);
            transform: translateY(-1px);
        }

        .topbar-btn svg {
            flex-shrink: 0;
        }

        @media(max-width:768px) {
            .topbar {
                padding: 12px 20px;
                flex-direction: column;
                gap: 10px;
            }

            .topbar-actions {
                width: 100%;
                display: flex;
                gap: 10px;
            }

            .topbar-btn {
                flex: 1;
                justify-content: center;
            }
        }

        /* WRAP */
        .wrap {
            max-width: var(--max);
            margin: 0 auto;
            padding: 0 32px;
        }

        @media(max-width:640px) {
            .wrap {
                padding: 0 20px;
            }
        }

        /* HERO SECTION */
        .proj-hero {
            padding: 48px 0 0;
        }

        .proj-hero-top {
            margin-bottom: 32px;
        }

        .proj-kicker {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 11.6px;
            font-weight: 650;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .proj-kicker::before {
            content: '';
            width: 28px;
            height: 1px;
            background: linear-gradient(90deg, var(--accent), transparent);
        }

        .proj-title {
            font-size: clamp(32px, 5vw, 52px);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.05;
            margin-bottom: 12px;
        }

        .proj-subtitle {
            font-size: 18px;
            color: var(--muted);
            font-weight: 500;
            max-width: 600px;
        }

        /* SCREENSHOTS CAROUSEL */
        .screenshots {
            position: relative;
            margin-bottom: 48px;
        }

        .ss-track {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: 4px 0 20px;
        }

        .ss-track::-webkit-scrollbar {
            display: none;
        }

        .ss-item {
            flex: 0 0 auto;
            width: 70%;
            max-width: 560px;
            scroll-snap-align: center;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.07);
            background: rgba(22, 26, 35, 0.7);
            position: relative;
        }

        .ss-item img {
            width: 100%;
            height: auto;
            display: block;
            aspect-ratio: 16/10;
            object-fit: cover;
        }

        .ss-label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 5px 10px;
            border-radius: 8px;
        }

        @media(max-width:640px) {
            .ss-item {
                width: 85%;
            }
        }

        /* DOTS */
        .ss-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .ss-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--line);
            border: none;
            cursor: pointer;
            transition: background 0.3s, transform 0.3s;
        }

        .ss-dot.active {
            background: var(--accent);
            transform: scale(1.3);
        }

        /* PROJECT META BAR */
        .proj-meta-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            padding: 24px 0;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            margin-bottom: 48px;
        }

        .proj-meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .proj-meta-item span {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted2);
        }

        .proj-meta-item b {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        /* CONTENT SECTIONS */
        .proj-content {
            padding-bottom: 80px;
        }

        .proj-section {
            margin-bottom: 48px;
        }

        .proj-section-title {
            font-size: 22px;
            font-weight: 750;
            letter-spacing: -0.01em;
            margin-bottom: 16px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .proj-section-title::before {
            content: '';
            width: 4px;
            height: 22px;
            background: var(--accent);
            border-radius: 2px;
        }

        .proj-desc {
            font-size: 16px;
            color: #bcc2cc;
            line-height: 1.8;
            max-width: 720px;
        }

        .proj-desc strong {
            color: var(--text);
            font-weight: 600;
        }

        .case-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .case-card {
            padding: 22px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            background: rgba(22, 26, 35, 0.7);
            backdrop-filter: blur(10px);
        }

        .case-card h3 {
            margin-bottom: 9px;
            font-size: 14px;
            color: var(--text);
        }

        .case-card p {
            font-size: 13.5px;
            line-height: 1.7;
            color: var(--muted);
        }

        @media(max-width:760px) {
            .case-grid { grid-template-columns: 1fr; }
        }

        /* FEATURES LIST */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        @media(max-width:700px) {
            .features-grid {
                grid-template-columns: 1fr;
            }
        }

        .feature-card {
            background: rgba(22, 26, 35, 0.65);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 24px;
            transition: border-color 0.3s, transform 0.3s;
        }

        .feature-card:hover {
            border-color: rgba(58, 134, 255, 0.2);
            transform: translateY(-2px);
        }

        .feature-card h4 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feature-card h4 .feat-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: rgba(58, 134, 255, 0.1);
            border: 1px solid rgba(58, 134, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .feature-card ul {
            list-style: none;
            padding: 0;
        }

        .feature-card li {
            font-size: 13.5px;
            color: var(--muted);
            line-height: 1.7;
            padding-left: 18px;
            position: relative;
        }

        .feature-card li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 9px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0.6;
        }

        /* STACK CHIPS */
        .stack-section {
            padding: 32px 0;
            border-top: 1px solid var(--line);
        }

        .stack-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--muted2);
            margin-bottom: 16px;
        }

        .stack-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stack-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            transition: border-color 0.3s, background 0.3s, transform 0.2s;
        }

        .stack-chip:hover {
            border-color: rgba(58, 134, 255, 0.3);
            background: rgba(58, 134, 255, 0.06);
            transform: translateY(-1px);
        }

        .chip-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* HIGHLIGHTS */
        .highlights {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .highlight-tag {
            font-size: 12px;
            font-weight: 650;
            padding: 7px 14px;
            border-radius: 999px;
            background: rgba(34, 211, 154, 0.08);
            border: 1px solid rgba(34, 211, 154, 0.2);
            color: var(--accent2);
        }

        /* NEXT/PREV PROJECT */
        .proj-nav {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding: 40px 0;
            border-top: 1px solid var(--line);
        }

        .proj-nav-link {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.02);
            text-decoration: none;
            transition: border-color 0.3s, background 0.3s;
        }

        .proj-nav-link:hover {
            border-color: rgba(58, 134, 255, 0.2);
            background: rgba(58, 134, 255, 0.04);
        }

        .proj-nav-link.next {
            text-align: right;
        }

        .proj-nav-label {
            font-size: 11px;
            font-weight: 650;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted2);
        }

        .proj-nav-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }

        @media(max-width:600px) {
            .proj-nav {
                grid-template-columns: 1fr;
            }
        }

        /* GITHUB BUTTON */
        .github-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            text-decoration: none;
            color: #fff;
            background: linear-gradient(135deg, #24292e 0%, #1a1d21 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.35s cubic-bezier(.22, 1, .36, 1);
            position: relative;
            overflow: hidden;
        }

        .github-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(58, 134, 255, 0.15) 0%, rgba(34, 211, 154, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.35s;
        }

        .github-btn:hover::before {
            opacity: 1;
        }

        .github-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35), 0 0 30px rgba(58, 134, 255, 0.1);
            border-color: rgba(58, 134, 255, 0.3);
        }

        .github-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        .github-btn svg {
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .github-btn span {
            position: relative;
            z-index: 1;
        }

        .github-row {
            display: flex;
            justify-content: center;
            padding: 48px 0 40px;
        }

        /* LIGHTBOX */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(6, 8, 12, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            cursor: zoom-out;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(.22, 1, .36, 1);
            object-fit: contain;
        }

        .lightbox.active .lightbox-img {
            transform: scale(1);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s;
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .lightbox-caption {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s;
        }

        .lightbox-nav:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }

        .ss-item {
            cursor: zoom-in;
        }

        /* LOADING OVERLAY */
        #loadOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(6, 8, 12, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #loadOverlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lo-spinner {
            width: 32px;
            height: 32px;
            border: 2.5px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: loSpin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes loSpin {
            to {
                transform: rotate(360deg);
            }
        }

        .lo-text {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* FOOTER */
        footer {
            border-top: 1px solid var(--line);
            padding: 24px 0;
            text-align: center;
            font-size: 12.5px;
            color: var(--muted2);
        }

        footer a {
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: var(--text);
        }
    </style>
</head>

<body>
    <canvas id="bg-aurora" aria-hidden="true" style="position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.97;"></canvas>
    <a class="skip-link" href="#projectContent">Skip to project content</a>

    <!-- LOADING OVERLAY -->
    <div id="loadOverlay">
        <div class="lo-spinner"></div>
        <div class="lo-text">Loading Projects…</div>
    </div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">&times;</button>
        <button class="lightbox-nav lightbox-prev" id="lightboxPrev">&#8249;</button>
        <button class="lightbox-nav lightbox-next" id="lightboxNext">&#8250;</button>
        <img class="lightbox-img" id="lightboxImg" src="" alt="Screenshot preview">
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>

    <!-- TOPBAR -->
    <div class="topbar">
        <a href="index.html" class="topbar-brand">Mohib Ahmad <span>— Portfolio</span></a>
        <div class="topbar-actions">
            <a href="index.html?from=project" class="topbar-btn" id="backBtn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                All Projects
            </a>
            <a href="resume.html" class="topbar-btn primary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">

                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                            <path d="M2 2l7.586 7.586"/>
                            <circle cx="11" cy="11" r="2"/>
                        </svg>
                        <span>View Project</span>
                    </a>
                </div>` : '';

            const createNavHTML = (p) => {
                let prevLink = '<div></div>';
                if (p.prev && projects[p.prev]) {
                    prevLink = `<a href="project.html?id=${p.prev}" class="proj-nav-link"><span class="proj-nav-label">← Previous</span><span class="proj-nav-name">${projects[p.prev].title}</span></a>`;
                }
                let nextLink = '<div></div>';
                if (p.next && projects[p.next]) {
                    nextLink = `<a href="project.html?id=${p.next}" class="proj-nav-link next"><span class="proj-nav-label">Next →</span><span class="proj-nav-name">${projects[p.next].title}</span></a>`;
                }
                return prevLink + nextLink;
            };

            const renderProject = (p) => {
                document.getElementById('projHero').innerHTML = createHeroHTML(p);
                document.getElementById('screenshots').innerHTML = createScreenshotsHTML(p);
                document.getElementById('projMeta').innerHTML = createMetaHTML(p);

                document.getElementById('projContent').innerHTML = `
                    <div class="proj-section">
                        <h2 class="proj-section-title">Overview</h2>
                        <p class="proj-desc">${p.description}</p>
                    </div>
                    <div class="proj-section">
                        <h2 class="proj-section-title">Implemented Scope</h2>
                        <div class="features-grid">${createFeaturesHTML(p)}</div>
                    </div>
                    ${p.caseStudy ? `
                    <div class="proj-section">
                        <h2 class="proj-section-title">Engineering Case Study</h2>
                        <div class="case-grid">
                            ${p.caseStudy.map(item => `
                                <article class="case-card">
                                    <h3>${item.title}</h3>
                                    <p>${item.text}</p>
                                </article>`).join('')}
                        </div>
                    </div>` : ''}
                    <div class="stack-section">${createStackHTML(p)}</div>
                    ${createGithubButtonHTML(p)}
                    ${createAppStoreButtonHTML(p)}
                `;

                document.getElementById('projNav').innerHTML = createNavHTML(p);
            };

            renderProject(project);

            // Screenshot scroll dots
            const track = document.querySelector('.ss-track');
            const dots = document.querySelectorAll('.ss-dot');
            if (track && dots.length) {
                track.addEventListener('scroll', () => {
                    const scrollLeft = track.scrollLeft;
                    const itemWidth = track.querySelector('.ss-item').offsetWidth + 16;
                    const active = Math.round(scrollLeft / itemWidth);
                    dots.forEach((d, i) => d.classList.toggle('active', i === active));
                });
                dots.forEach(d => {
                    d.addEventListener('click', () => {
                        const itemWidth = track.querySelector('.ss-item').offsetWidth + 16;
                        track.scrollTo({ left: d.dataset.index * itemWidth, behavior: 'smooth' });
                    });
                });
            }

            // Lightbox for screenshots
            (function () {
                const lightbox = document.getElementById('lightbox');
                const lightboxImg = document.getElementById('lightboxImg');
                const lightboxCaption = document.getElementById('lightboxCaption');
                const lightboxClose = document.getElementById('lightboxClose');
                const lightboxPrev = document.getElementById('lightboxPrev');
                const lightboxNext = document.getElementById('lightboxNext');
                if (!lightbox || !lightboxImg) return;

                let currentIndex = 0;
                let images = [];

                function getImages() {
                    const items = document.querySelectorAll('.ss-item');
                    images = [];
                    items.forEach((item, i) => {
                        const img = item.querySelector('img');
                        const label = item.querySelector('.ss-label');
                        if (img) {
                            images.push({
                                src: img.src,
                                alt: img.alt,
                                label: label ? label.textContent : ''
                            });
                            item.style.cursor = 'zoom-in';
                            item.addEventListener('click', () => openLightbox(i));
                        }
                    });
                }

                function openLightbox(index) {
                    currentIndex = index;
                    updateLightbox();
                    lightbox.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }

                function closeLightbox() {
                    lightbox.classList.remove('active');
                    document.body.style.overflow = '';
                }

                function updateLightbox() {
                    if (images[currentIndex]) {
                        lightboxImg.src = images[currentIndex].src;
                        lightboxImg.alt = images[currentIndex].alt;
                        lightboxCaption.textContent = images[currentIndex].label || '';
                        lightboxPrev.style.display = images.length > 1 ? 'flex' : 'none';
                        lightboxNext.style.display = images.length > 1 ? 'flex' : 'none';
                    }
                }

                function nextImage() {
                    currentIndex = (currentIndex + 1) % images.length;
                    updateLightbox();
                }

                function prevImage() {
                    currentIndex = (currentIndex - 1 + images.length) % images.length;
                    updateLightbox();
                }

                lightboxClose.addEventListener('click', closeLightbox);
                lightbox.addEventListener('click', (e) => {
                    if (e.target === lightbox) closeLightbox();
                });
                lightboxPrev.addEventListener('click', (e) => { e.stopPropagation(); prevImage(); });
                lightboxNext.addEventListener('click', (e) => { e.stopPropagation(); nextImage(); });

                document.addEventListener('keydown', (e) => {
                    if (!lightbox.classList.contains('active')) return;
                    if (e.key === 'Escape') closeLightbox();
                    if (e.key === 'ArrowRight') nextImage();
                    if (e.key === 'ArrowLeft') prevImage();
                });

                getImages();
            })();
        }

        // Loading overlay on "All Projects" click
        (function () {
            var overlay = document.getElementById('loadOverlay');
            var backBtn = document.getElementById('backBtn');
            if (!overlay || !backBtn) return;
            backBtn.addEventListener('click', function (e) {
                e.preventDefault();
                overlay.classList.add('active');
                setTimeout(function () {
                    window.location.href = 'index.html?from=project';
                }, 600);
            });
        })();

        if (window.AntigravityTransition) {
            window.AntigravityTransition.mountBackground({ count: 230 });
        }

        /* ===== aurora background with stars ===== */
        (function () {
            var c = document.getElementById('bg-aurora');
            if (!c || !c.getContext) return;
            var x = c.getContext('2d', { alpha: true });
            var W, H, d = Math.min(window.devicePixelRatio || 1, 1.2), t = 0;
            function rs() { W = c.width = innerWidth * d; H = c.height = innerHeight * d; c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px'; }
            rs(); addEventListener('resize', rs);
            var blobs = [
                { hx: .72, hy: .16, r: .40, h: 215, s: .31 },
                { hx: .20, hy: .60, r: .33, h: 266, s: .21 },
                { hx: .52, hy: .8, r: .29, h: 198, s: .26 }
            ];
            var stars = [];
            for (var i = 0; i < 38; i++) {
                stars.push({
                    x: Math.random(),
                    y: Math.random(),
                    size: 1.0 + Math.random() * 1.5,
                    speed: 0.015 + Math.random() * 0.035,
                    phase: Math.random() * Math.PI * 2,
                    depth: 0.25 + Math.random() * 0.75,
                    ci: Math.floor(Math.random() * 4)
                });
            }
            var mx = 0, my = 0, tx = 0, ty = 0;
            addEventListener('mousemove', function (e) {
                tx = (e.clientX / window.innerWidth - 0.5) * 24;
                ty = (e.clientY / window.innerHeight - 0.5) * 24;
            }, { passive: true });

            var frameSkip = 0;
            (function draw() {
                if (++frameSkip % 2) { requestAnimationFrame(draw); return; }
                t += 0.0072;
                mx += (tx - mx) * 0.08;
                my += (ty - my) * 0.08;
                x.clearRect(0, 0, W, H);
                stars.forEach(function (s) {
                    var sx = s.x * W - mx * s.depth * d;
                    var sy = s.y * H - my * s.depth * d;
                    var op = 0.18 + Math.sin(t * s.speed * 10 + s.phase) * 0.28;
                    var colors = [
                        [0, 242, 254],
                        [58, 134, 255],
                        [34, 211, 154],
                        [255, 255, 255]
                    ];
                    var c = colors[s.ci % colors.length];
                    x.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + op.toFixed(3) + ')';
                    x.shadowBlur = s.size * 5 * d;
                    x.shadowColor = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.7)';
                    x.beginPath();
                    x.arc(sx, sy, s.size * d, 0, Math.PI * 2);
                    x.fill();
                    x.shadowBlur = 0;
                });
                blobs.forEach(function (b, i) {
                    var bx = W * (b.hx + Math.sin(t * b.s + i) * 0.032);
                    var by = H * (b.hy + Math.cos(t * b.s * 1.22 + i * 1.1) * 0.028);
                    var rad = Math.min(W, H) * b.r;
                    var g = x.createRadialGradient(bx, by, 0, bx, by, rad);
                    g.addColorStop(0, 'hsla(' + b.h + ',72%,60%,0.084)');
                    g.addColorStop(0.5, 'hsla(' + (b.h + 7) + ',58%,52%,0.034)');
                    g.addColorStop(1, 'rgba(8,10,14,0)');
                    x.fillStyle = g; x.beginPath(); x.arc(bx, by, rad, 0, Math.PI * 2); x.fill();
                });
                requestAnimationFrame(draw);
            })();
        })();
    </script>
</body>
