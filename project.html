    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0b0d13;
            --bg2: #10141c;
            --surface: #161a23;
            --surface2: #1b202b;
            --line: #252b36;
            --text: #e9ebf1;
            --muted: #9aa1ae;
            --muted2: #6f7580;
            --accent: #3a86ff;
            --accent2: #22d39a;
            --max: 960px;
            --r: 16px;
            --ease: cubic-bezier(.22, 1, .36, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        .skip-link {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 10000;
            padding: 10px 14px;
            border-radius: 8px;
            background: #fff;
            color: #07101f;
            font-weight: 700;
            transform: translateY(-160%);
            transition: transform .2s ease;
        }

        .skip-link:focus { transform: translateY(0); }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* TOPBAR */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 13, 19, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--line);
            padding: 14px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topbar-brand {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.01em;
            text-decoration: none;
            transition: color 0.3s;
        }

        .topbar-brand:hover {
            color: var(--accent);
        }

        .topbar-brand span {
            color: var(--muted);
            font-weight: 500;
        }

        .topbar-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 650;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.22s var(--ease);
            text-decoration: none;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--muted);
        }

        .topbar-btn:hover {
            border-color: rgba(255, 255, 255, 0.2);
            color: var(--text);
            background: rgba(255, 255, 255, 0.03);
        }

        .topbar-btn.primary {
            background: var(--accent);
            border: 1px solid var(--accent);
            color: #fff;
            box-shadow: 0 8px 24px rgba(58, 134, 255, 0.2);
        }

        .topbar-btn.primary:hover {
            background: #256ee0;
            box-shadow: 0 12px 32px rgba(58, 134, 255, 0.3);
            transform: translateY(-1px);
        }

        .topbar-btn svg {
            flex-shrink: 0;
        }

        @media(max-width:768px) {
            .topbar {
                padding: 12px 20px;
                flex-direction: column;
                gap: 10px;
            }

            .topbar-actions {
                width: 100%;
                display: flex;
                gap: 10px;
            }

            .topbar-btn {
                flex: 1;
                justify-content: center;
            }
        }

        /* WRAP */
        .wrap {
            max-width: var(--max);
            margin: 0 auto;
            padding: 0 32px;
        }

        @media(max-width:640px) {
            .wrap {
                padding: 0 20px;
            }
        }

        /* HERO SECTION */
        .proj-hero {
            padding: 48px 0 0;
        }

        .proj-hero-top {
            margin-bottom: 32px;
        }

        .proj-kicker {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 11.6px;
            font-weight: 650;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .proj-kicker::before {
            content: '';
            width: 28px;
            height: 1px;
            background: linear-gradient(90deg, var(--accent), transparent);
        }

        .proj-title {
            font-size: clamp(32px, 5vw, 52px);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.05;
            margin-bottom: 12px;
        }

        .proj-subtitle {
            font-size: 18px;
            color: var(--muted);
            font-weight: 500;
            max-width: 600px;
        }

        /* SCREENSHOTS CAROUSEL */
        .screenshots {
            position: relative;
            margin-bottom: 48px;
        }

        .ss-track {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: 4px 0 20px;
        }

        .ss-track::-webkit-scrollbar {
            display: none;
        }

        .ss-item {
            flex: 0 0 auto;
            width: 70%;
            max-width: 560px;
            scroll-snap-align: center;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.07);
            background: var(--surface);
            position: relative;
        }

        .ss-item img {
            width: 100%;
            height: auto;
            display: block;
            aspect-ratio: 16/10;
            object-fit: cover;
        }

        .ss-label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 5px 10px;
            border-radius: 8px;
        }

        @media(max-width:640px) {
            .ss-item {
                width: 85%;
            }
        }

        /* DOTS */
        .ss-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .ss-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--line);
            border: none;
            cursor: pointer;
            transition: background 0.3s, transform 0.3s;
        }

        .ss-dot.active {
            background: var(--accent);
            transform: scale(1.3);
        }

        /* PROJECT META BAR */
        .proj-meta-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            padding: 24px 0;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            margin-bottom: 48px;
        }

        .proj-meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .proj-meta-item span {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted2);
        }

        .proj-meta-item b {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        /* CONTENT SECTIONS */
        .proj-content {
            padding-bottom: 80px;
        }

        .proj-section {
            margin-bottom: 48px;
        }

        .proj-section-title {
            font-size: 22px;
            font-weight: 750;
            letter-spacing: -0.01em;
            margin-bottom: 16px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .proj-section-title::before {
            content: '';
            width: 4px;
            height: 22px;
            background: var(--accent);
            border-radius: 2px;
        }

        .proj-desc {
            font-size: 16px;
            color: #bcc2cc;
            line-height: 1.8;
            max-width: 720px;
        }

        .proj-desc strong {
            color: var(--text);
            font-weight: 600;
        }

        /* FEATURES LIST */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        @media(max-width:700px) {
            .features-grid {
                grid-template-columns: 1fr;
            }
        }

        .feature-card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, rgba(255, 255, 255, 0) 100%), var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 24px;
            transition: border-color 0.3s, transform 0.3s;
        }

        .feature-card:hover {
            border-color: rgba(58, 134, 255, 0.2);
            transform: translateY(-2px);
        }

        .feature-card h4 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feature-card h4 .feat-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: rgba(58, 134, 255, 0.1);
            border: 1px solid rgba(58, 134, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .feature-card ul {
            list-style: none;
            padding: 0;
        }

        .feature-card li {
            font-size: 13.5px;
            color: var(--muted);
            line-height: 1.7;
            padding-left: 18px;
            position: relative;
        }

        .feature-card li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 9px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0.6;
        }

        /* STACK CHIPS */
        .stack-section {
            padding: 32px 0;
            border-top: 1px solid var(--line);
        }

        .stack-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--muted2);
            margin-bottom: 16px;
        }

        .stack-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stack-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            transition: border-color 0.3s, background 0.3s, transform 0.2s;
        }

        .stack-chip:hover {
            border-color: rgba(58, 134, 255, 0.3);
            background: rgba(58, 134, 255, 0.06);
            transform: translateY(-1px);
        }

        .chip-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* HIGHLIGHTS */
        .highlights {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .highlight-tag {
            font-size: 12px;
            font-weight: 650;
            padding: 7px 14px;
            border-radius: 999px;
            background: rgba(34, 211, 154, 0.08);
            border: 1px solid rgba(34, 211, 154, 0.2);
            color: var(--accent2);
        }

        /* NEXT/PREV PROJECT */
        .proj-nav {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding: 40px 0;
            border-top: 1px solid var(--line);
        }

        .proj-nav-link {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.02);
            text-decoration: none;
            transition: border-color 0.3s, background 0.3s;
        }

        .proj-nav-link:hover {
            border-color: rgba(58, 134, 255, 0.2);
            background: rgba(58, 134, 255, 0.04);
        }

        .proj-nav-link.next {
            text-align: right;
        }

        .proj-nav-label {
            font-size: 11px;
            font-weight: 650;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted2);
        }

        .proj-nav-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }

        @media(max-width:600px) {
            .proj-nav {
                grid-template-columns: 1fr;
            }
        }

        /* GITHUB BUTTON */
        .github-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            text-decoration: none;
            color: #fff;
            background: linear-gradient(135deg, #24292e 0%, #1a1d21 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.35s cubic-bezier(.22, 1, .36, 1);
            position: relative;
            overflow: hidden;
        }

        .github-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(58, 134, 255, 0.15) 0%, rgba(34, 211, 154, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.35s;
        }

        .github-btn:hover::before {
            opacity: 1;
        }

        .github-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35), 0 0 30px rgba(58, 134, 255, 0.1);
            border-color: rgba(58, 134, 255, 0.3);
        }

        .github-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        .github-btn svg {
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .github-btn span {
            position: relative;
            z-index: 1;
        }

        .github-row {
            display: flex;
            justify-content: center;
            padding: 48px 0 40px;
        }

        /* LOADING OVERLAY */
        #loadOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(6, 8, 12, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #loadOverlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lo-spinner {
            width: 32px;
            height: 32px;
            border: 2.5px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: loSpin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes loSpin {
            to {
                transform: rotate(360deg);
            }
        }

        .lo-text {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* FOOTER */
        footer {
            border-top: 1px solid var(--line);
            padding: 24px 0;
            text-align: center;
            font-size: 12.5px;
            color: var(--muted2);
        }

        footer a {
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: var(--text);
        }
    </style>
</head>
